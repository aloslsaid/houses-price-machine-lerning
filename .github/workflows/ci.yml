name: Python syntax check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile training script
        run: python -c "import py_compile; py_compile.compile("house price 0000", doraise=True)"
